# Home Assistant with this integration mounted in, for browser tests.
#
# The official image is used rather than a devcontainer image so the suite runs
# against the current release by default. Each HA release requires a specific
# minimum Python, so installing a newer HA into an older image does not work:
# 2026.8.3 needs Python >= 3.14.2, and an image built for 2025.3 ships 3.13.
# Taking the version from the image tag keeps the interpreter and HA in step.
#
# The official image does no onboarding, so `onboard.sh` creates the admin user
# and finishes the onboarding steps over HA's API once the container is healthy.

services:
  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:${HA_VERSION:-stable}"
    ports:
      - "${HA_PORT:-8123}:8123"
    volumes:
      # The integration under test. Read-write because Python wants to write
      # __pycache__ next to the sources.
      - ../custom_components/statistics_outlier_cleaner:/config/custom_components/statistics_outlier_cleaner
      - ./bootstrap.sh:/bootstrap.sh:ro
    environment:
      TZ: "${TZ:-Europe/London}"
    # configuration.yaml has to exist before HA starts, and the image has no hook
    # between the two, so write it here and then hand off to the real entrypoint.
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    healthcheck:
      # curl is not guaranteed to be in the image; python is, since HA runs on it.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8123/manifest.json')",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
