# Home Assistant with this integration mounted in, for browser tests.
#
# The official image is used directly. bootstrap.sh stands in for the onboarding
# wizard — it creates the login user and marks onboarding done — so the tests can
# reach the login form unattended. The integration serves its own panel over a
# static path, so no Lovelace/HACS machinery is needed.

services:
  homeassistant:
    # HA_VERSION picks the release under test. Default to the latest stable;
    # frontend internals are what this suite guards, so pin it to reproduce a
    # report (e.g. HA_VERSION=2026.8.3).
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-stable}
    entrypoint: ["bash", "/bootstrap.sh"]
    ports:
      - "${HA_PORT:-8123}:8123"
    volumes:
      # The integration under test. Read-write because Python writes __pycache__
      # next to the sources.
      - ../custom_components/statistics_outlier_cleaner:/config/custom_components/statistics_outlier_cleaner
      - ./bootstrap.sh:/bootstrap.sh:ro
    environment:
      HASS_USERNAME: "${HASS_USERNAME:-dev}"
      HASS_PASSWORD: "${HASS_PASSWORD:-dev}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8123/manifest.json || exit 1"]
      interval: 5s
      timeout: 5s
      # Generous: a cold official image has to set up default_config before the
      # panel's static path is registered.
      retries: 90
      start_period: 60s
